services:
  # ─── Infrastructure ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: minidiscord-redis
    restart: "on-failure:3"
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 96M
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: minidiscord-rabbitmq
    restart: "on-failure:3"
    ports:
      - "15672:15672" # Management UI (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: minidiscord-postgres
    restart: "on-failure:3"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discord_mini_users
    volumes:
      - ./dev-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - dev-pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:7-jammy
    container_name: minidiscord-mongodb
    restart: "on-failure:3"
    volumes:
      - dev-mongodata:/data/db
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: minidiscord-eureka
    ports:
      - "8761:8761"
    environment:
      - EUREKA_HOSTNAME=discovery-server
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - minidiscord-net
    restart: "on-failure:3"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Core Services ─────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: minidiscord-user
    ports:
      - "8081:8081"
    environment:
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_URL=jdbc:postgresql://postgres:5432/discord_mini_users
      - DB_USERNAME=postgres
      - USER_DB_URL=jdbc:postgresql://postgres:5432/discord_mini_users
      - USER_DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=false
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_VHOST=/
      - RABBITMQ_SSL=false
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - minidiscord-net
    restart: "on-failure:3"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: minidiscord-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=false
      - JWT_SECRET=${JWT_SECRET}
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - minidiscord-net
    restart: "on-failure:3"

  # ─── Additional Services ───────────────────────────
  group-channel-service:
    build:
      context: .
      dockerfile: group-channel-service/Dockerfile
    container_name: minidiscord-group-channel
    expose:
      - "8082"
    environment:
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_URL=jdbc:postgresql://postgres:5432/discord_mini_groups
      - DB_USERNAME=postgres
      - GROUP_DB_URL=jdbc:postgresql://postgres:5432/discord_mini_groups
      - GROUP_DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_VHOST=/
      - RABBITMQ_SSL=false
      - JWT_SECRET=${JWT_SECRET}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      postgres:
        condition: service_started
    networks:
      - minidiscord-net
    restart: "on-failure:3"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8082/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  chat-history-service:
    build:
      context: .
      dockerfile: chat-history-service/Dockerfile
    container_name: minidiscord-chat-history
    expose:
      - "8083"
    environment:
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - MONGODB_URI=mongodb://mongodb:27017/discord_mini_chat
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_VHOST=/
      - RABBITMQ_SSL=false
      - JWT_SECRET=${JWT_SECRET}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      mongodb:
        condition: service_started
    networks:
      - minidiscord-net
    restart: "on-failure:3"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8083/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s

  messaging-service:
    build:
      context: .
      dockerfile: messaging-service/Dockerfile
    container_name: minidiscord-messaging
    expose:
      - "8084"
    environment:
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=false
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_VHOST=/
      - RABBITMQ_SSL=false
      - JWT_SECRET=${JWT_SECRET}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - minidiscord-net
    restart: "on-failure:3"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8084/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s

  file-service:
    build:
      context: .
      dockerfile: file-service/Dockerfile
    container_name: minidiscord-file
    expose:
      - "8085"
    env_file: .env
    environment:
      - EUREKA_URL=http://discovery-server:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net
    restart: "on-failure:3"

volumes:
  dev-pgdata:
  dev-mongodata:

networks:
  minidiscord-net:
    driver: bridge
