services:
  # ─── Infrastructure ──────────────────────────────

  discovery-server:
    image: ghcr.io/phatnguyentt2/minidiscord-eureka:latest
    container_name: minidiscord-eureka
    restart: "on-failure:5"
    expose:
      - "8761"
    environment:
      - EUREKA_HOSTNAME=discovery-server
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ─── Core Services ──────────────────────────────
  api-gateway:
    image: ghcr.io/phatnguyentt2/minidiscord-gateway:latest
    container_name: minidiscord-gateway
    restart: "on-failure:5"
    ports:
      - "127.0.0.1:8080:8080" # ⚠️ Chỉ bind localhost — Nginx proxy vào, không expose ra Internet
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 400M
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net

  user-service:
    image: ghcr.io/phatnguyentt2/minidiscord-user:latest
    container_name: minidiscord-user
    restart: "on-failure:5"
    expose:
      - "8081"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M # ↑ Tăng từ 400M nhờ Droplet 2GB RAM
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ─── Additional Services ──────────────────────────────
  group-channel-service:
    image: ghcr.io/phatnguyentt2/minidiscord-group-channel:latest
    container_name: minidiscord-group-channel
    restart: "on-failure:5"
    expose:
      - "8082"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8082/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  chat-history-service:
    image: ghcr.io/phatnguyentt2/minidiscord-chat-history:latest
    container_name: minidiscord-chat-history
    restart: "on-failure:5"
    expose:
      - "8083"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8083/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s

  messaging-service:
    image: ghcr.io/phatnguyentt2/minidiscord-messaging:latest
    container_name: minidiscord-messaging
    restart: "on-failure:5"
    expose:
      - "8084"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - METERED_DOMAIN=${METERED_DOMAIN:-}
      - METERED_SECRET_KEY=${METERED_SECRET_KEY:-}
      - MUSIC_EXTRACTOR_URL=http://music-extractor:3001
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8084/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s

  music-extractor:
    image: ghcr.io/phatnguyentt2/minidiscord-music-extractor:latest
    container_name: minidiscord-music-extractor
    volumes:
      - /opt/minidiscord/cookies.txt:/app/cookies.txt:ro
    restart: "on-failure:5"
    expose:
      - "3001"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - minidiscord-net

  file-service:
    image: ghcr.io/phatnguyentt2/minidiscord-file:latest
    container_name: minidiscord-file
    restart: "on-failure:5"
    expose:
      - "8085"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net

networks:
  minidiscord-net:
    driver: bridge
