services:
  # ─── Infrastructure ──────────────────────────────

  discovery-server:
    image: ghcr.io/phatnguyentt2/minidiscord-eureka:latest
    container_name: minidiscord-eureka
    restart: always
    expose:
      - "8761"
    environment:
      - EUREKA_HOSTNAME=discovery-server
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ─── Core Services ──────────────────────────────
  api-gateway:
    image: ghcr.io/phatnguyentt2/minidiscord-gateway:latest
    container_name: minidiscord-gateway
    restart: always
    ports:
      - "127.0.0.1:8080:8080" # ⚠️ Chỉ bind localhost — Nginx proxy vào, không expose ra Internet
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 300M
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net

  user-service:
    image: ghcr.io/phatnguyentt2/minidiscord-user:latest
    container_name: minidiscord-user
    restart: always
    expose:
      - "8081"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_URL=${USER_DB_URL}
      - DB_USERNAME=${USER_DB_USERNAME}
    deploy:
      resources:
        limits:
          memory: 512M # ↑ Tăng từ 400M nhờ Droplet 2GB RAM
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ─── Additional Services ──────────────────────────────
  group-channel-service:
    image: ghcr.io/phatnguyentt2/minidiscord-group-channel:latest
    container_name: minidiscord-group-channel
    restart: always
    expose:
      - "8082"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
      - DB_URL=${GROUP_DB_URL}
      - DB_USERNAME=${GROUP_DB_USERNAME}
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8082/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s

  chat-history-service:
    image: ghcr.io/phatnguyentt2/minidiscord-chat-history:latest
    container_name: minidiscord-chat-history
    restart: always
    expose:
      - "8083"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8083/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s

  messaging-service:
    image: ghcr.io/phatnguyentt2/minidiscord-messaging:latest
    container_name: minidiscord-messaging
    restart: always
    expose:
      - "8084"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8084/actuator/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 50s

  file-service:
    image: ghcr.io/phatnguyentt2/minidiscord-file:latest
    container_name: minidiscord-file
    restart: always
    expose:
      - "8085"
    env_file: .env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EUREKA_URL=http://discovery-server:8761/eureka/
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      discovery-server:
        condition: service_healthy
    networks:
      - minidiscord-net

networks:
  minidiscord-net:
    driver: bridge
