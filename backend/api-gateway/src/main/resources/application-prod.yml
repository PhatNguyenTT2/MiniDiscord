# === PRODUCTION PROFILE (DigitalOcean) ===
# Eureka enabled — Load-balanced routing via Service Discovery
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**, /api/users/**

        - id: group-channel-service
          uri: lb://group-channel-service
          predicates:
            - Path=/api/rooms/**, /api/channels/**

        - id: chat-history-service
          uri: lb://chat-history-service
          predicates:
            - Path=/api/messages/**

        - id: messaging-service
          uri: lb://messaging-service
          predicates:
            - Path=/ws/**, /api/voice/**

        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/files/**
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:true}

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/}

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:https://minidiscord.vercel.app}
    allowed-origin-patterns: ${CORS_ORIGIN_PATTERNS:https://*.vercel.app}
